      why: "Calls the wrapper as analytics.track(analytics.event.swapsFlippedAssets, ...). The name is a member of the event
        map in src/analytics/event.ts, which maps swapsFlippedAssets to 'swaps.flipped_assets'. It is one fixed name,
        not built from data."
    }
