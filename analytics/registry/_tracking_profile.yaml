# How this codebase sends analytics, written by the install audit and read by the scanner and the implementer.
# Changing it changes what the checks see: route it to the analytics owner (CODEOWNERS). A PR's edits count once merged.
version: 1
stack:
  - { path: ., language: typescript, framework: expo, sides: [ client ] }
  - { path: android, language: kotlin, framework: android, sides: [ client ] }
  - { path: ios, language: swift, framework: ios, sides: [ client ] }
sdks:
  - { package: posthog-react-native, side: client }
wrappers:
  - { path: src/analytics/index.ts, side: client, import: "import { analytics } from '@/analytics'" }
  - { path: src/__swaps__/utils/trackSwapEvent.ts, side: client }
calls:
  - {
      callee: analytics.track,
      from: "@/analytics",
      adds: [ walletAddressHash, walletType ],
      example: "analytics.track(analytics.event.swapsFlippedAssets, { inputAmount, previousInputAsset, previousOutputAsset })",
      ref: src/__swaps__/screens/Swap/components/FlipButton.tsx:97
    }
  - {
      callee: analytics.identify,
      from: "@/analytics",
      kind: identify,
      example: "analytics.identify({ installSource })",
      ref: src/App.tsx:173
    }
  - {
      callee: trackSwapEvent,
      from: "@/__swaps__/utils/trackSwapEvent",
      adds:
        [
          degenMode,
          errorMessage,
          inputAssetAddress,
          inputAssetAmount,
          inputAssetChainId,
          inputAssetName,
          inputAssetSymbol,
          inputAssetType,
          isBridge,
          isHardwareWallet,
          isSwappingToPopularAsset,
          mainnetAddress,
          outputAssetAddress,
          outputAssetAmount,
          outputAssetChainId,
          outputAssetName,
          outputAssetSymbol,
          outputAssetType,
          tradeAmountUSD,
          type
        ],
      example: "trackSwapEvent(analytics.event.swapsFailed, { errorMessage, isHardwareWallet, parameters, type, })",
      ref: src/__swaps__/screens/Swap/providers/swap-provider.tsx:342
    }
  - {
      callee: analytics.track,
      adds: [ walletAddressHash, walletType ],
      side: client,
      example: "analytics.track(analytics.event.swapsFlippedAssets, { inputAmount, previousInputAsset, previousOutputAsset })",
      ref: src/__swaps__/screens/Swap/components/FlipButton.tsx:97
    }
  - {
      callee: analytics.identify,
      kind: identify,
      side: client,
      example: "analytics.identify({ currency: 'USD' })",
      ref: src/analytics/index.test.ts:116
    }
  - { callee: analytics.screen, name_arg: 0, side: client }
  - {
      callee: analytics.identify,
      from: "@/analytics",
      kind: user_set,
      props_arg: 0,
      example: "analytics.identify({ installSource })",
      ref: src/App.tsx:173
    }
  - { callee: analytics.screen, from: "@/analytics", adds: [ walletAddressHash, walletType ] }
  - {
      callee: analytics.screen,
      from: "@/analytics",
      name_arg: 0,
      props_arg: 1,
      adds: [ walletAddressHash, walletType ]
    }
  - { callee: analytics.screen, name_arg: 0, props_arg: 1, adds: [ walletAddressHash, walletType ], side: client }
direct_sdk: fail
paths:
  server: []
  client:
    - src/
notes: []
