  - name: wc.failed_request
    section: WalletConnect
    description: "Fires on the client each time a WalletConnect (dapp connection) proposal or request is refused or fails
      inside the app. Seven call sites, no success path: (1) onSessionProposal.ts:175, after the dapp's proposed
      namespaces fail validation and the session has been rejected (`type = invalid namespaces`, `reason` = the validation
      error message); (2-4) onSessionRequest.ts:84, 119 and 147, for a signing request with no address or message, a
      request for a read-only or unknown wallet, and a session topic not found (`type` = session_request | read only
      wallet | session_request); (5) onSessionRequest.ts:214, for an RPC method the app doesn't support (`type = method
      not supported`, with `method`); (6) NoNeedWCSheet.tsx:36, on mount of the redirect sheet when a user tries
      WalletConnect from inside the in-app dapp browser (`type = dapp browser`). It does not fire when the session is
      approved. It does not fire when the user rejects a proposal, which is `Rejected new WalletConnect session`. It does
      not fire when the try/catch around `approveSession` (onSessionProposal.ts:184) catches an error: that branch only
      shows an alert and logs. The type union also allows `session_proposal`, but no call sends it. `walletAddressHash`
      and `walletType` are added by `analytics.track` from the wallet context, not by the call."
    question: How often do dapp connections and requests fail, why (unsupported method, read-only wallet, invalid
      namespaces, dapp browser), and from which dapps?
    track_via: client
    properties:
      - name: connector
        type: string
        example: UNCONFIRMED
        required: false
      - name: dappName
        type: string
        example: UNCONFIRMED
        required: false
      - name: dappUrl
        type: string
        example: UNCONFIRMED
        required: false
      - name: method
        type: string
        example: UNCONFIRMED
        required: false
        description: The WalletConnect RPC method the dapp asked for. Sent only for type = method not supported
          (onSessionRequest.ts:217). Values are whatever the dapp sends, e.g. an eth_* or wallet_* method (UNCONFIRMED).
      - name: reason
        type: string
        example: session_request exited, signing request had no address and/or messsage | session_request exited, selectedWallet
          was falsy or read only | session_request topic was not found | received unsupported session_request RPC method |
          tried to connect with WalletConnect in the dapp browser | <WalletKit namespace validation error message>
        description: Fixed English sentence per call site, except for invalid namespaces, where it is the error message returned
          by the WalletKit namespace validator (free-form).
      - name: type
        type: string
        example: session_request | read only wallet | method not supported | invalid namespaces | dapp browser
        description: Failure category. The event schema also allows session_proposal, but no call sends it.
      - name: walletAddressHash
        type: string
        example: UNCONFIRMED
        required: false
        description: Hash of the active wallet address, added by analytics.track default metadata (securelyHashWalletAddress).
          Missing when no address is set yet.
      - name: walletType
        type: string
        example: owned | hardware | watched
        required: false
        description: Type of the active wallet, added by analytics.track default metadata. Can be undefined.
    changelog:
      - date: 2026-10-31
        ref: install-audit
        change: Drafted from code; nothing arriving
