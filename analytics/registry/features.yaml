events:
  - name: app_icon_unlock_sheet.cta_pressed
    section: App icon
    description: The person taps the button on the app icon unlock sheet. The sheet closes, the Settings sheet opens, and
      after a 500 ms delay it navigates to the App Icon settings page. The event is sent after that navigation call, not
      at the moment of the tap. It fires once per tap and is not a confirmation that the icon was applied.
    question: Of the people who see the unlock sheet for an icon, how many go on to the app icon settings?
    track_via: client
    properties:
      - name: appIcon
        type: string
        example: optimism | smol | zora | golddoge | raindoge | pooly | finiliar | zorb | poolboy | adworld | farcaster |
          redacted (UNCONFIRMED)
        description: Key of the unlockable icon shown on the sheet (UnlockableAppIconKey). The list in appIcons.ts continues
          past 'redacted'.
      - name: walletAddressHash
        type: string
        example: UNCONFIRMED
        required: false
        description: Hash of the active wallet address, added by the analytics wrapper. Left out when no address is set.
      - name: walletType
        type: string
        example: owned | hardware | watched
        required: false
        description: Type of the active wallet, added by the analytics wrapper. Can be undefined right after wallet creation.
    changelog:
      - date: 2026-10-31
        ref: install-audit
        change: Drafted from code; nothing arriving
  - name: app_icon_unlock_sheet.viewed
    section: App icon
    description: The app icon unlock sheet mounts, or the appIconKey route param changes. Fires from a useEffect, so once
      per sheet open. It does not fire on re-renders.
    question: How many people open the unlock sheet for each icon?
    track_via: client
    properties:
      - name: appIcon
        type: string
        example: optimism | smol | zora | golddoge | raindoge | pooly | finiliar | zorb | poolboy | adworld | farcaster |
          redacted (UNCONFIRMED)
        description: Key of the unlockable icon shown on the sheet.
      - name: walletAddressHash
        type: string
        example: UNCONFIRMED
        required: false
        description: Hash of the active wallet address, added by the analytics wrapper.
      - name: walletType
        type: string
        example: owned | hardware | watched
        required: false
        description: Type of the active wallet, added by the analytics wrapper.
    changelog:
      - date: 2026-10-31
        ref: install-audit
        change: Drafted from code; nothing arriving
  - name: Approved new WalletConnect session
    section: WalletConnect
    description: A WalletConnect session proposal is approved. It fires after client.approveSession resolves without
      throwing, and before the redirect sheet. It does not fire when the proposal is rejected, when the namespaces are
      invalid, or when approveSession throws. Rejections are a separate event.
    question: How many dapp connection requests become connected sessions, and from which dapps?
    track_via: client
    properties:
      - name: connector
        type: string
        example: UNCONFIRMED
        required: false
        description: Not sent by this event. The draft picked it up from the 'New WalletConnect pairing' call
          (onSessionProposal.ts:41).
      - name: dappName
        type: string
        example: UNCONFIRMED
        description: Name from the dapp's proposer metadata. The dapp declares it itself.
      - name: dappUrl
        type: string
        example: UNCONFIRMED
        description: URL from the dapp's proposer metadata.
      - name: reason
        type: string
        example: UNCONFIRMED
        required: false
        description: Not sent by this event. It belongs to wc.failed_request (onSessionProposal.ts:175).
      - name: type
        type: string
        example: UNCONFIRMED
        required: false
        description: Not sent by this event. It belongs to wc.failed_request (onSessionProposal.ts:175).
      - name: walletAddressHash
        type: string
        example: UNCONFIRMED
        required: false
        description: Hash of the active wallet address, added by the analytics wrapper.
      - name: walletType
        type: string
        example: owned | hardware | watched
        required: false
        description: Type of the active wallet, added by the analytics wrapper.
    changelog:
      - date: 2026-10-31
        ref: install-audit
        change: Drafted from code; nothing arriving
  - name: Backup Complete
    section: Backup
    description: A cloud backup of all wallets succeeded. It fires in the onSuccess callback of backupAllWalletsToCloud.
      That is after the encrypted file is uploaded and the wallets are marked backed up, and after the password is stored
      locally. It fires before the backups list re-syncs. A failed backup sends backup.error instead, and an abandoned one
      sends neither. Whether the single-wallet branch (walletId set) also reaches this call isn't shown in the code read.
    question: How many cloud backups complete, per cloud platform?
    track_via: client
    properties:
      - name: category
        type: string
        example: backup
        required: false
        description: Constant 'backup'.
      - name: label
        type: string
        example: iCloud | Google Drive
        required: false
        description: "Cloud platform: iCloud on iOS, Google Drive on Android."
      - name: walletAddressHash
        type: string
        example: UNCONFIRMED
        required: false
        description: Hash of the active wallet address, added by the analytics wrapper.
      - name: walletType
        type: string
        example: owned | hardware | watched
        required: false
        description: Type of the active wallet, added by the analytics wrapper.
    changelog:
      - date: 2026-10-31
        ref: install-audit
        change: Drafted from code; nothing arriving
  - name: backup.error
    section: Backup
    description: Creating a cloud backup of all wallets throws an Error inside backupAllWalletsToCloud (create, encrypt or
      upload). It fires after the error is shown to the user and reported to Sentry. Non-Error throws send nothing, and
      the no-keys early return sends nothing. It is the failure counterpart of Backup Complete.
    question: How often do cloud backups fail, and with which message?
    track_via: client
    properties:
      - name: category
        type: string
        example: backup
        required: false
        description: Constant 'backup'.
      - name: error
        type: string
        example: UNCONFIRMED
        required: false
        description: "Translated, user-facing message from getBackupErrorMessage: keychain access, decrypting data, no backups
          found, cannot get encrypted data, missing PIN, wrong PIN, malformed backup data, or a generic message with a
          numeric code. It varies by app language."
      - name: label
        type: string
        example: iCloud | Google Drive
        required: false
        description: Cloud platform.
      - name: walletAddressHash
        type: string
        example: UNCONFIRMED
        required: false
        description: Hash of the active wallet address, added by the analytics wrapper.
      - name: walletType
        type: string
        example: owned | hardware | watched
        required: false
        description: Type of the active wallet, added by the analytics wrapper.
    changelog:
      - date: 2026-10-31
        ref: install-audit
        change: Drafted from code; nothing arriving
  - name: BackupSheet shown
    section: Backup
    description: A BackupSheetSection mounts, or its `type` prop changes. It fires from a useEffect, so once per sheet
      display. It is not a backup attempt.
    question: How many people are shown each backup prompt, as the start of the backup funnel?
    track_via: client
    properties:
      - name: category
        type: string
        example: backup
        description: Constant 'backup'.
      - name: label
        type: string
        example: UNCONFIRMED
        description: The sheet's `type` prop, which names the backup prompt variant. No caller was found in the code read.
      - name: walletAddressHash
        type: string
        example: UNCONFIRMED
        required: false
        description: Hash of the active wallet address, added by the analytics wrapper.
      - name: walletType
        type: string
        example: owned | hardware | watched
        required: false
        description: Type of the active wallet, added by the analytics wrapper.
    changelog:
      - date: 2026-10-31
        ref: install-audit
        change: Drafted from code; nothing arriving
  - name: browser.add_favorite
    section: Dapp browser
    description: A site is added to the favorites in the dapp browser. It fires in addFavorite, only when the standardized
      URL (no protocol, www, trailing slash or query) isn't already a favorite, and before the store updates. Repeat adds
      of the same URL send nothing. Removing a favorite sends nothing.
    question: How many dapps do people favorite, and which ones?
    track_via: client
    properties:
      - name: image
        type: string
        example: UNCONFIRMED
        description: Image URL of the site, from the favorited site object.
      - name: name
        type: string
        example: UNCONFIRMED
        description: Site name. When added from the homepage menu it is derived from the URL.
      - name: url
        type: string
        example: UNCONFIRMED
        description: "Standardized site URL: no protocol, no www, no query string."
      - name: walletAddressHash
        type: string
        example: UNCONFIRMED
        required: false
        description: Hash of the active wallet address, added by the analytics wrapper.
      - name: walletType
        type: string
        example: owned | hardware | watched
        required: false
        description: Type of the active wallet, added by the analytics wrapper.
    changelog:
      - date: 2026-10-31
        ref: install-audit
        change: Drafted from code; nothing arriving
  - name: browser.tap_favorite
    section: Dapp browser
    description: The person taps a favorite dapp tile on the browser homepage. It fires in onPressFavorite just before
      navigating to the dapp's URL. The whole favorite object is passed as properties.
    question: How often do people open a dapp from their favorites?
    track_via: client
    properties:
      - name: hasClickedBefore
        type: boolean
        example: UNCONFIRMED
        required: false
        description: Not sent by this event. It belongs to browser.trending_dapp_pressed (Homepage.tsx:337).
      - name: index
        type: numeric
        example: UNCONFIRMED
        required: false
        description: Not sent by this event. It belongs to browser.trending_dapp_pressed.
      - name: name
        type: string
        example: UNCONFIRMED
        description: Name of the favorited site.
      - name: url
        type: string
        example: UNCONFIRMED
        description: Standardized URL of the favorited site.
      - name: walletAddressHash
        type: string
        example: UNCONFIRMED
        required: false
        description: Hash of the active wallet address, added by the analytics wrapper.
      - name: walletType
        type: string
        example: owned | hardware | watched
        required: false
        description: Type of the active wallet, added by the analytics wrapper.
    changelog:
      - date: 2026-10-31
        ref: install-audit
        change: Drafted from code; nothing arriving
  - name: browser.trending_dapp_pressed
    section: Dapp browser
    description: The person taps a dapp in a homepage list (trending or recents) and the tile has a truthy `index`. It fires
      just before navigating to the site. Because of the `index &&` guard, a tile at index 0 never sends it.
    question: Which trending dapps do people open, and are they new to the person?
    track_via: client
    properties:
      - name: hasClickedBefore
        type: boolean
        example: true | false
        description: Whether the browser history shows the URL was visited before.
      - name: index
        type: numeric
        example: UNCONFIRMED
        description: Position of the tile in the list. Never 0, because of the guard.
      - name: name
        type: string
        example: UNCONFIRMED
        description: Site name.
      - name: url
        type: string
        example: UNCONFIRMED
        description: Site URL as given on the tile.
      - name: walletAddressHash
        type: string
        example: UNCONFIRMED
        required: false
        description: Hash of the active wallet address, added by the analytics wrapper.
      - name: walletType
        type: string
        example: owned | hardware | watched
        required: false
        description: Type of the active wallet, added by the analytics wrapper.
    changelog:
      - date: 2026-10-31
        ref: install-audit
        change: Drafted from code; nothing arriving
  - name: cash.amount_entered
    section: Cash
    description: The person confirms a deposit amount with Hold to Add, with a card as the funding source. It fires at the
      start of handleHoldToAdd, before the wallet-link check and before any order is submitted. It is not sent per
      keypress, and it is not sent for the wallet-check failure, which has its own event.
    question: How much do people try to add, and do they use presets or the keypad?
    track_via: client
    properties:
      - name: amount
        type: numeric
        example: UNCONFIRMED
        required: false
        description: USD deposit amount from toAnalyticsAmount. It can be undefined.
      - name: entryMode
        type: string
        example: preset | keypad
        description: How the amount was entered.
      - name: reason
        type: string
        example: UNCONFIRMED
        required: false
        description: Not sent by this event. It belongs to cash.wallet_check_failed (AddCashSheet.tsx:495).
      - name: walletAddressHash
        type: string
        example: UNCONFIRMED
        required: false
        description: Hash of the active wallet address, added by the analytics wrapper.
      - name: walletType
        type: string
        example: owned | hardware | watched
        required: false
        description: Type of the active wallet, added by the analytics wrapper.
    changelog:
      - date: 2026-10-31
        ref: install-audit
        change: Drafted from code; nothing arriving
  - name: cash.buy_completed
    section: Cash
    description: A cash buy order reaches the Completed status. It fires in applyTerminalOrder, only when the order has
      cryptoAmount, fiatAmount, createdTime and completedTime. A completed order missing any of these sends nothing. It
      also fires when the result is found by polling or by a resume probe. Failed orders send cash.buy_failed, which is a
      separate event.
    question: How many deposits complete, for how much, and how long until USDC arrives?
    track_via: client
    properties:
      - name: amount
        type: numeric
        example: UNCONFIRMED
        required: false
        description: Not sent by this event. It belongs to cash.buy_submitted.
      - name: cryptoAmount
        type: numeric
        example: UNCONFIRMED
        description: Amount of crypto received.
      - name: errorCode
        type: string
        example: PAYMENT_REJECTED | GENERIC
        required: false
        description: Not sent by this event. It belongs to cash.buy_failed.
      - name: failureReason
        type: string
        example: UNCONFIRMED
        required: false
        description: Not sent by this event. It belongs to cash.buy_failed.
      - name: fiatAmount
        type: numeric
        example: UNCONFIRMED
        description: Fiat amount charged.
      - name: fiatCurrency
        type: string
        example: UNCONFIRMED
        description: Currency code of the fiat amount.
      - name: network
        type: string
        example: UNCONFIRMED
        description: Network of the received crypto asset.
      - name: orderId
        type: string
        example: UNCONFIRMED
        required: false
        description: Not sent by this event. It belongs to cash.buy_failed.
      - name: timeToUsdcMs
        type: numeric
        example: UNCONFIRMED
        description: completedTime minus createdTime of the order, in ms. It is order latency, not the person's time.
      - name: walletAddressHash
        type: string
        example: UNCONFIRMED
        required: false
        description: Hash of the active wallet address, added by the analytics wrapper.
      - name: walletType
        type: string
        example: owned | hardware | watched
        required: false
        description: Type of the active wallet, added by the analytics wrapper.
    changelog:
      - date: 2026-10-31
        ref: install-audit
        change: Drafted from code; nothing arriving
  - name: cash.buy_failed
    section: Cash
    description: "A cash buy order fails. It fires in two places: the order is polled or probed as terminal with status
      Failed, or createBuyOrder is definitively rejected (the second case has failureReason null and errorCode GENERIC).
      Ambiguous failures, passkey cancellations and access refusals send nothing."
    question: How many deposits fail, and why?
    track_via: client
    properties:
      - name: amount
        type: numeric
        example: UNCONFIRMED
        required: false
        description: Not sent by this event. It belongs to cash.buy_submitted.
      - name: cryptoAmount
        type: numeric
        example: UNCONFIRMED
        required: false
        description: Not sent by this event. It belongs to cash.buy_completed.
      - name: errorCode
        type: string
        example: PAYMENT_REJECTED | GENERIC
        description: PAYMENT_REJECTED when failureReason is PaymentRejected, otherwise GENERIC.
      - name: failureReason
        type: string
        example: null | PaymentRejected (UNCONFIRMED)
        description: Order failure reason from the ramp backend. It is null when createBuyOrder was rejected. Other enum values
          were not observed.
      - name: fiatAmount
        type: numeric
        example: UNCONFIRMED
        required: false
        description: Not sent by this event.
      - name: fiatCurrency
        type: string
        example: UNCONFIRMED
        required: false
        description: Not sent by this event.
      - name: network
        type: string
        example: UNCONFIRMED
        required: false
        description: Not sent by this event.
      - name: orderId
        type: string
        example: UUID v4, e.g. 5b48c62e-5484-4225-95d5-570d4cb45992
        description: Order id. It is a client-generated uuidv4 in the submit path.
      - name: timeToUsdcMs
        type: numeric
        example: UNCONFIRMED
        required: false
        description: Not sent by this event.
      - name: walletAddressHash
        type: string
        example: UNCONFIRMED
        required: false
        description: Hash of the active wallet address, added by the analytics wrapper.
      - name: walletType
        type: string
        example: owned | hardware | watched
        required: false
        description: Type of the active wallet, added by the analytics wrapper.
    changelog:
      - date: 2026-10-31
        ref: install-audit
        change: Drafted from code; nothing arriving
  - name: cash.buy_submitted
    section: Cash
    description: A buy order is submitted, at the start of submitBuyOrder. It fires before the order is created or sent, and
      only if no order is already pending. A same-spec retry after a failure fires it again. It does not mean the backend
      accepted the order. The outcome is cash.buy_completed or cash.buy_failed.
    question: How many deposits are started, and how many finish?
    track_via: client
    properties:
      - name: amount
        type: numeric
        example: UNCONFIRMED
        required: false
        description: Submitted USD amount from toAnalyticsAmount. It can be undefined.
      - name: cryptoAmount
        type: numeric
        example: UNCONFIRMED
        required: false
        description: Not sent by this event.
      - name: errorCode
        type: string
        example: PAYMENT_REJECTED | GENERIC
        required: false
        description: Not sent by this event.
      - name: failureReason
        type: string
        example: UNCONFIRMED
        required: false
        description: Not sent by this event.
      - name: fiatAmount
        type: numeric
        example: UNCONFIRMED
        required: false
        description: Not sent by this event.
      - name: fiatCurrency
        type: string
        example: UNCONFIRMED
        required: false
        description: Not sent by this event.
      - name: network
        type: string
        example: UNCONFIRMED
        required: false
        description: Not sent by this event.
      - name: orderId
        type: string
        example: UNCONFIRMED
        required: false
        description: Not sent by this event, although the order id exists at that point.
      - name: timeToUsdcMs
        type: numeric
        example: UNCONFIRMED
        required: false
        description: Not sent by this event.
      - name: walletAddressHash
        type: string
        example: UNCONFIRMED
        required: false
        description: Hash of the active wallet address, added by the analytics wrapper.
      - name: walletType
        type: string
        example: owned | hardware | watched
        required: false
        description: Type of the active wallet, added by the analytics wrapper.
    changelog:
      - date: 2026-10-31
        ref: install-audit
        change: Drafted from code; nothing arriving
  - name: cash.card_link_failed
    section: Cash
    description: Linking a card fails in cardLinkFlowStore.submit. It fires from the catch branch when the flow was not
      aborted and the error isn't a handled cash error. Cancellations and handled errors return to the form and send
      nothing. Success is a separate event, cash.card_linked.
    question: How often does card linking fail, and why?
    track_via: client
    properties:
      - name: brand
        type: string
        example: UNCONFIRMED
        required: false
        description: Not sent by this event. It belongs to cash.card_linked (cardLinkFlowStore.ts:47).
      - name: reason
        type: string
        example: server_error | client_error | offline | unknown
        description: Telemetry error reason from getTelemetryErrorReason. Based on the HTTP status or network failure.
      - name: walletAddressHash
        type: string
        example: UNCONFIRMED
        required: false
        description: Hash of the active wallet address, added by the analytics wrapper.
      - name: walletType
        type: string
        example: owned | hardware | watched
        required: false
        description: Type of the active wallet, added by the analytics wrapper.
    changelog:
      - date: 2026-10-31
        ref: install-audit
        change: Drafted from code; nothing arriving
  - name: cash.card_linked
    section: Cash
    description: "Fires on the client when a debit/credit card has been linked successfully: after linkCardWithVault
      resolves and the card has been added to the cash payment-method store, and only if the user didn't abort the flow in
      the meantime. Does not fire on cancel, on a handled cash error that sends the user back to the form, on a duplicate
      submit while submitting, or on failure (a failure sends cash.card_link_failed instead)."
    question: How many people link a card to their cash account, which card brands, and how many attempts fail?
    track_via: client
    properties:
      - name: brand
        type: string
        example: Visa
        description: Display brand of the linked card (from card.brand); the type comment gives "Visa" as the example. Full list
          of brands not visible in this code.
      - name: reason
        type: string
        example: not sent
        required: false
        description: Not sent by this event. It comes from cash.card_linked's neighbour cash.card_link_failed (offline |
          client_error | server_error | unknown) at cardLinkFlowStore.ts:58.
      - name: walletAddressHash
        type: string
        example: 0x<64 hex chars> (keyed HMAC-SHA256 of the wallet address)
        required: false
        description: Added by analytics.track to every event; omitted when no wallet address is active or hashing fails.
      - name: walletType
        type: string
        example: owned | hardware | watched
        required: false
        description: Added by analytics.track to every event; type of the active wallet, may be undefined right after wallet creation.
    changelog:
      - date: 2026-10-31
        ref: install-audit
        change: Drafted from code; nothing arriving
  - name: cash.deposit_intro_viewed
    section: Cash
    description: Fires on the client each time the Cash deposit intro panel gains focus (useFocusEffect, so also when the
      user navigates back to it) while the remote config flag cash_signup_enabled is true. It also re-fires if the flag
      value changes while the panel is focused. Does not fire when sign-up is paused (cash.deposit_signup_paused_viewed
      fires instead), and is not a click on Set Up Account.
    question: How many people see the Cash intro, and how many go on to start account setup?
    track_via: client
    properties:
      - name: walletAddressHash
        type: string
        example: 0x<64 hex chars> (keyed HMAC-SHA256 of the wallet address)
        required: false
        description: Added by analytics.track to every event; omitted when no wallet address is active or hashing fails.
      - name: walletType
        type: string
        example: owned | hardware | watched
        required: false
        description: Added by analytics.track to every event; hardware wallets can't set up an account, so this shows how many
          of them see the intro.
    changelog:
      - date: 2026-10-31
        ref: install-audit
        change: Drafted from code; nothing arriving
  - name: cash.deposit_signup_paused_viewed
    section: Cash
    description: "Fires on the client each time the Cash deposit intro panel gains focus (useFocusEffect, including
      returning to it) while the remote config flag cash_signup_enabled is false, i.e. the same panel shown with sign-up
      paused. Shares its call with cash.deposit_intro_viewed: exactly one of the two fires per focus."
    question: How many people hit the intro while Cash sign-up is paused?
    track_via: client
    properties:
      - name: walletAddressHash
        type: string
        example: 0x<64 hex chars> (keyed HMAC-SHA256 of the wallet address)
        required: false
        description: Added by analytics.track to every event; omitted when no wallet address is active or hashing fails.
      - name: walletType
        type: string
        example: owned | hardware | watched
        required: false
        description: Added by analytics.track to every event.
    changelog:
      - date: 2026-10-31
        ref: install-audit
        change: Drafted from code; nothing arriving
  - name: cash.existing_account_recovery_selected
    section: Cash
    description: Fires on the client when, on the existing-account prompt in Cash setup (the phone number already belongs to
      an account registered with a passkey), the user chooses the secondary action to recover access instead of signing in
      with their existing passkey. Fires on press, before the recovery challenge is requested; the recovery request result
      is tracked separately (cash.phone_submitted with mode recovery, or cash.phone_submit_failed). Does not fire if the
      state isn't existingAccount.
    question: Of people told their account already exists, how many say they lost their passkey and go to recovery?
    track_via: client
    properties:
      - name: mode
        type: string
        example: not sent
        required: false
        description: Not sent by this event; belongs to cash.phone_submitted (signup | resume | recovery).
      - name: outcome
        type: string
        example: not sent
        required: false
        description: Not sent by this event; belongs to cash.phone_already_registered (alreadyRegistered | registeredWithPasskey).
      - name: reason
        type: string
        example: not sent
        required: false
        description: Not sent by this event; belongs to cash.phone_submit_failed.
      - name: walletAddressHash
        type: string
        example: 0x<64 hex chars> (keyed HMAC-SHA256 of the wallet address)
        required: false
        description: Added by analytics.track to every event; omitted when no wallet address is active or hashing fails.
      - name: walletType
        type: string
        example: owned | hardware | watched
        required: false
        description: Added by analytics.track to every event.
    changelog:
      - date: 2026-10-31
        ref: install-audit
        change: Drafted from code; nothing arriving
  - name: cash.kyc_approved
    section: Cash
    description: "Fires on the client once the KYC provider's verdict for the user's Cash account is read as approved. Two
      paths: the submit flow in useSubmitReviewFlow after polling getUserStatus ends in an approved outcome, and
      trackKycOutcome when an approved outcome is read on resume or return to the flow. Carries no event-specific
      properties. Does not fire for reviewing, rejected or unsupported-state outcomes."
    question: How many people who submit identity verification are approved, and what share of submissions end approved?
    track_via: client
    properties:
      - name: mode
