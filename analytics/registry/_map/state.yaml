events:
  performance.time_to_sign:
    fires_in: src/state/performance/performance.ts#logPerformance
    trigger: The last timed step of a signing flow finishes (swap, send, deposit, or the dapp-request sheet closing). It also fires when the
      person cancels.
    moment: after success
    conditions:
      - "the wrapped function was created with isEndOfFlow: true"
      - the wrapped function returned, resolved, or threw synchronously
      - the active wallet is not a hardware wallet
    path:
      - src/features/dapp-request/screens/SignTransactionSheet.tsx#SignTransactionSheet
      - src/state/performance/performance.ts#executeFn
      - src/state/performance/performance.ts#logPerformance
    certainty: sure
  performance.time_to_sign.operation:
    fires_in: src/state/performance/performance.ts#logPerformance
    trigger: Any timed step of a signing flow finishes, such as keychain read, authentication, nonce, sign or broadcast.
    moment: after success
    conditions:
      - the function wrapped by executeFn returned, resolved, or threw synchronously
      - the active wallet is not a hardware wallet
    path:
      - src/features/dapp-request/screens/SignTransactionSheet.tsx#SignTransactionSheet
      - src/state/performance/performance.ts#executeFn
      - src/state/performance/performance.ts#logPerformance
    certainty: sure
  wallet_initialization.failed:
    fires_in: src/state/wallets/initializeWallet.ts#initializeWallet
    trigger: Setting up or switching to a wallet throws an error, other than the wallet already being imported.
    moment: after failure
    conditions:
      - initializeWallet threw
      - the error is not WalletAlreadyExistsError
    path:
      - src/screens/WelcomeScreen/WelcomeScreen.tsx#WelcomeScreen
      - src/state/wallets/initializeWallet.ts#initializeWallet
    certainty: sure
