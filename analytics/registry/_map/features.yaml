    trigger: The KYC provider has not given a verdict and the person is shown the reviewing state
    moment: after success
    conditions:
      - "submit path: the review delay passed while polling, or a status poll failed after submission; at most once per run"
      - "resume or return path: the outcome read is reviewing"
