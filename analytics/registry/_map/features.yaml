    moment: after failure
    conditions:
      - the thrown value is an Error instance
      - createBackup returned data (the no-keys early return sends nothing)
    path:
      - src/screens/SettingsSheet/components/Backups/ViewWalletBackup.tsx#ViewWalletBackup
