      - name: walletAddressHash
        type: string
        example: UNCONFIRMED
        required: false
        description: Hash of the active wallet address, added to every event by the analytics wrapper. Empty when no address is set.
      - name: walletType
        type: string
        example: owned | hardware | watched
        required: false
        description: Type of the active wallet, added to every event by the analytics wrapper. Can be undefined, for example
          right after wallet creation.
