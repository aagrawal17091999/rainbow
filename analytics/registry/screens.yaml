  - name: Viewed profile
    section: Profiles
    description: "Fires on the client from an effect in the ProfileSheet screen when both a profile address and the active
      account address are set. That means once when the sheet opens. It fires again whenever the effect's inputs change:
      the route params object, the resolved ENS name, the profile address or the account address. Loading the ENS name
      after the sheet opens can therefore produce a second event. It fires whether the profile is the person's own or
      someone else's, and whether the sheet is a preview or not. It fires on view, before the profile data finishes
      loading."
    question: How many profile sheets do people open, and from where?
    track_via: client
    properties:
      - name: category
        type: string
        example: profiles
        description: Always the literal 'profiles'.
      - name: fromRoute
        type: string
        example: UNCONFIRMED
        description: Route name of the screen the person came from, taken from the sheet's route params.
      - name: name
        type: string
        example: UNCONFIRMED
        description: ENS name of the profile being viewed. It is an empty string when the profile is the person's own account.
      - name: walletAddressHash
        type: string
        example: UNCONFIRMED
        required: false
        description: Hash of the active wallet address, added to every event by the analytics wrapper.
      - name: walletType
        type: string
        example: owned | hardware | watched
        required: false
        description: Type of the active wallet, added to every event by the analytics wrapper.
