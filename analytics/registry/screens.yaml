    description: Fires on the client once, after interactions finish following mount of the WalletConnect approval sheet
      (connect or transaction/signature type). Fires when the sheet is shown, not when the person approves or rejects.
      Approval, cancel and dismissal (which counts as rejection) have no event, so abandonment is shown only as this event
      with no outcome.
    question: How many WalletConnect session requests are shown to people, and what share are approved?
    track_via: client
    properties:
      - name: dappName
        type: string
        example: UNCONFIRMED
        required: false
        description: Not sent by this event. The draft took it from the neighbouring 'Received wc connection' call (line 298).
      - name: dappUrl
        type: string
        example: UNCONFIRMED
        required: false
        description: Not sent by this event. The draft took it from the neighbouring 'Received wc connection' call (line 298).
      - name: waitingTime
        type: string
        example: UNCONFIRMED
        required: false
        description: Not sent by this event. Belongs to 'Received wc connection' (seconds, or an error string).
      - name: walletAddressHash
        type: string
        example: UNCONFIRMED
        required: false
        description: Hash of the active wallet address, added by the analytics wrapper.
      - name: walletType
        type: string
        example: owned | hardware | watched
        required: false
        description: Type of the active wallet, added by the analytics wrapper.
