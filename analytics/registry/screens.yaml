    description: Fires when the Learn web view screen is closed or unmounted, not when it opens. It is sent from the cleanup
      of a useEffect, with the seconds the screen was open. The cleanup also runs if the route params (category,
      displayType, key, routeName, url) change while the screen is open, which would send an extra event.
    question: Which Learn articles do people read, and for how long?
    track_via: client
    properties:
      - name: cardId
        type: string
        example: UNCONFIRMED
        description: Key of the Learn card that opened the article.
      - name: category
        type: string
        example: UNCONFIRMED
        description: LearnCategory of the article.
      - name: displayType
        type: string
        example: UNCONFIRMED
        description: CardType used to show the card that opened the article.
      - name: durationSeconds
        type: numeric
        example: "12.4"
        description: Seconds between screen mount and close, with decimals.
      - name: routeName
        type: string
        example: UNCONFIRMED
        description: Route the card was on when tapped.
      - name: url
        type: string
        example: UNCONFIRMED
        description: Article URL.
      - name: walletAddressHash
        type: string
        example: UNCONFIRMED
        required: false
        description: Hash of the active wallet address, added by analytics.track.
      - name: walletType
        type: string
        example: owned | hardware | watched
        required: false
        description: Type of the active wallet, added by analytics.track.
