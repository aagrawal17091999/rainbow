    description: Fires on the client at most once per mount of the expanded asset sheet's balance section, the first time
      the spot PnL pill reports it has been shown (onShown). A ref in BalanceSection guards it, so the pill remounting
      when the asset becomes owned or not owned doesn't fire it again. Closing and reopening the sheet fires it again.
    question: How often do people see a spot PnL pill on an asset, and in which state (unrealized, partially or fully realized)?
    track_via: client
    properties:
      - name: chainId
        type: string
        example: 1 | 10 | 8453
        description: Chain ID of the asset (sent as a number in code, ChainId enum).
      - name: tokenAddress
        type: string
        example: UNCONFIRMED
        description: Contract address of the asset the sheet is open for (basicAsset.address).
      - name: variant
        type: string
        example: unrealized | partiallyRealized | fullyRealized
        description: State of the PnL pill (SpotPnlVariant).
      - name: walletAddressHash
        type: string
        example: UNCONFIRMED
        required: false
        description: Hash of the active wallet address, added by the analytics wrapper.
      - name: walletType
        type: string
        example: owned | hardware | watched
        required: false
        description: Type of the active wallet, added by the analytics wrapper.
    changelog:
      - date: 2026-10-31
        ref: install-audit
        change: Drafted from code; nothing arriving
