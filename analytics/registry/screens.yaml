  - name: top_holders.shown
    section: Asset sheet
    description: Fires on the client, at most once per mount of the Top Holders section in the expanded asset sheet. It
      fires the first time the top-holders feature is enabled, a PnL-eligible token is present, and holders data is
      available to render. The loading skeleton, a failed load and an empty result do not count as shown. Cached data from
      an earlier fetch counts if it is on screen. The once-only guard is a ref, so closing and reopening the sheet fires
      it again, and a refetch within the same mount does not.
    question: How many people see the top-holders section on an asset, and for which tokens and chains?
