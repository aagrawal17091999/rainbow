  - name: token_launcher.wallet_load_failed
    section: Token launcher
    description: "Fires on the client when the person completes the hold-to-create gesture on the token launcher review
      screen and the app cannot get a usable signing wallet. The call runs before any token-creation request is sent. It
      has three branches: the active account is a hardware wallet (the app shows an alert and stops); the keychain returns
      no private key or a non-hex value, which includes not authenticated (the app opens the wallet error sheet); and any
      exception while loading the key or creating the token (the app opens the wallet error sheet). It does not fire when
      the person cancels the biometric prompt. It does not fire when the launch itself fails after the wallet loads,
      because that is a different event. The catch branch wraps the createToken call too, so a thrown error from token
      creation is also reported here."
    question: How often do people fail to create a token because their wallet can't sign, and for which reason?
    track_via: client
    properties:
      - name: address
        type: string
        example: UNCONFIRMED
        required: false
        description: Not sent by this event. The scanner picked it up from the token_launcher.share_pressed call at
          TokenLauncherFooter.tsx:212. See migration.
      - name: error
        type: string
        example: Hardware wallets are not supported by the token launcher SDK | Private key is null | Not authenticated |
          <error.message of a caught exception>
        description: Failure reason. Three fixed strings plus the free-text message of whatever exception was caught, so
          cardinality is open-ended.
      - name: url
        type: string
        example: UNCONFIRMED
        required: false
        description: Not sent by this event. The scanner picked it up from the token_launcher.share_pressed call at
