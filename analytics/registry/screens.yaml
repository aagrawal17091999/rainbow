        change: Drafted from code; nothing arriving
  - name: claim_claimable.failed
    section: Claimables
    description: A claim of a claimable (airdrop or reward) did not complete. Fires on the client in three places. (1)
      Airdrops/utils.ts claimAirdrop (claimableType rainbowCoin) fires when signing or sending the transaction throws,
      with failureStep 'claim'. This includes a user rejecting or cancelling the transaction, which is not a real failure.
      (2) SponsoredClaimableContext (claimableType sponsored) fires when the Addys API call throws, when the response has
      payload.success false, when the mutation errors, or when the mutation resolves while status is still 'claiming'
      (failureStep 'unknown'). (3) TransactionClaimableContext (claimableType transaction) fires when the claim or swap
      rap returns an error ('claim' or 'swap'), on a thrown error, and on the same unhandled or unresolved cases. It does
      not fire when biometrics or wallet loading fails in the sponsored flow.
    question: What share of claim attempts fail, at which step, and for which claimable types?
    track_via: client
    properties:
      - name: assets
        type: array
        example: '[{"symbol":"ETH","address":"0x…","amount":"0.1"}]'
        description: Assets being claimed, as {symbol, address, amount (string)} objects.
      - name: chainId
        type: numeric
        example: "1"
        description: Chain the claimable lives on.
      - name: claimableId
        type: string
        example: UNCONFIRMED
        description: Claimable type string for sponsored and transaction claims (claimable.type), but claimable.uniqueId for
          rainbowCoin airdrops.
      - name: claimableType
        type: string
        example: transaction | sponsored | rainbowCoin
        description: Kind of claimable.
      - name: errorMessage
        type: string
        example: UNCONFIRMED
        description: Constant message from the ErrorMessages enum in the sponsored and transaction flows. The raw exception
          message in the airdrop flow.
      - name: failureStep
        type: string
        example: claim | swap | unknown
        description: Step that failed. 'swap' only comes from the transaction flow.
      - name: isSwapping
        type: boolean
        example: true | false
        description: Whether the claim includes a swap into another output asset. Always false for sponsored and rainbowCoin claims.
      - name: outputAsset
        type: object
        example: '{"symbol":"ETH","address":"0x…"}'
        description: Asset the person ends up with.
      - name: outputChainId
        type: numeric
        example: "1"
        description: Chain of the output asset. The unhandled-error path sends -1 when the output config is missing.
      - name: usdValue
        type: string
        example: UNCONFIRMED
        description: Total claimable value in the display currency, as a string. The name says USD, but the value is
          claimable.totalCurrencyValue.amount.
      - name: walletAddressHash
        type: string
        example: UNCONFIRMED
        required: false
        description: Hash of the active wallet address, added by analytics.track.
      - name: walletType
        type: string
        example: owned | hardware | watched
        required: false
        description: Type of the active wallet, added by analytics.track.
    changelog:
      - date: 2026-10-31
        ref: install-audit
        change: Drafted from code; nothing arriving
  - name: claim_claimable.succeeded
    section: Claimables
    description: A claim of a claimable completed from the app's point of view. The rainbowCoin airdrop flow fires it after
      the signed transaction is submitted to the provider, before it is confirmed on-chain. The sponsored flow fires it
      when the Addys API answers with payload.success true, whether the status is 'success' or 'pending'. The transaction
      flow fires it after the claim (and swap, if any) finishes without error. It does not fire on failure.
    question: How many claims succeed, by claimable type, and how much value is claimed?
    track_via: client
    properties:
      - name: assets
        type: array
        example: '[{"symbol":"ETH","address":"0x…","amount":"0.1"}]'
        description: Assets claimed, as {symbol, address, amount (string)} objects.
      - name: chainId
        type: numeric
        example: "1"
        description: Chain the claimable lives on.
      - name: claimableId
        type: string
        example: UNCONFIRMED
        description: Claimable type string for sponsored and transaction claims, claimable.uniqueId for rainbowCoin airdrops.
      - name: claimableType
        type: string
        example: transaction | multi_transaction | sponsored | rainbowCoin
        description: Kind of claimable. In the transaction flow it is claimable.actionType.
      - name: errorMessage
        type: string
        example: UNCONFIRMED
        required: false
        description: Never sent on success. The draft lists it because the scanner merged calls.
      - name: failureStep
        type: string
        example: UNCONFIRMED
        required: false
        description: Never sent on success. The draft lists it because the scanner merged calls.
      - name: isSwapping
        type: boolean
        example: true | false
        description: Whether the claim included a swap into another asset.
      - name: outputAsset
        type: object
        example: '{"symbol":"ETH","address":"0x…"}'
        description: Asset the person received.
      - name: outputChainId
        type: numeric
        example: "1"
        description: Chain of the output asset.
      - name: usdValue
        type: string
        example: UNCONFIRMED
        description: Total claimable value in the display currency, as a string.
      - name: walletAddressHash
        type: string
        example: UNCONFIRMED
        required: false
        description: Hash of the active wallet address, added by analytics.track.
      - name: walletType
        type: string
        example: owned | hardware | watched
        required: false
        description: Type of the active wallet, added by analytics.track.
    changelog:
      - date: 2026-10-31
        ref: install-audit
        change: Drafted from code; nothing arriving
  - name: f2c.provider.flow_opened
    section: Fiat on-ramp
    description: The person taps a provider in the Add Cash list and the app has received a widget URL from getWidgetURL.
      Fires just before the URL opens in the external browser. It does not fire if the widget URL request fails (the
      person sees an alert instead). Completion comes back through an external callback (the rnbw.app/f2c redirect, which
      is currently passed only to Moonpay), so a flow_opened with no matching f2c.provider.flow_completed or flow_errored
      for the same sessionId is an abandonment, not a failure.
    question: How many people start buying crypto with a card, with which provider, and how many finish?
    track_via: client
    properties:
      - name: provider
        type: string
        example: ramp | coinbase | moonpay | stripe
        description: FiatProviderName of the selected provider.
      - name: sessionId
        type: string
        example: UNCONFIRMED
        description: Random nanoid generated per tap. It is also sent in the Moonpay redirect URI, so it can join the open event
          to completion events.
      - name: walletAddressHash
        type: string
        example: UNCONFIRMED
        required: false
        description: Hash of the active wallet address, added by analytics.track.
      - name: walletType
        type: string
        example: owned | hardware | watched
        required: false
        description: Type of the active wallet, added by analytics.track.
    changelog:
      - date: 2026-10-31
        ref: install-audit
        change: Drafted from code; nothing arriving
