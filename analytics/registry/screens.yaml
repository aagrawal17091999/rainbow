      fire for the network that is already selected. Disabled testnet rows can't be tapped.
    question: Which default network do people select?
    track_via: client
    properties:
      - name: chainId
        type: numeric
        example: "1"
        description: ChainId of the selected network (1 is mainnet). The draft typed it as string, but the schema says number.
      - name: walletAddressHash
        type: string
        example: UNCONFIRMED
        required: false
