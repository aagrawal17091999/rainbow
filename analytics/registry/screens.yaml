events:
  - name: add_wallet_flow.started
    section: Wallets
    description: The person picks one way to add a wallet on the Add Wallet sheet (create new, restore from seed, watch an
      address, restore from cloud) or taps Create new wallet in a wallet's backup settings (ViewWalletBackup). Fires on
      the tap, before navigation to the next screen, so it records intent only. Nothing here says whether a wallet was
      actually added. The 'Connect hardware wallet' option sends it with type ledger_nano_x and isFirstWallet hard-coded
      to false.
    question: How many people start adding a wallet, by method, and how many are first-time wallets?
    track_via: client
    properties:
      - name: isFirstWallet
        type: boolean
        example: true | false
        description: True when the sheet was opened for the user's first wallet. Hard-coded false from the hardware-wallet
          option and from ViewWalletBackup.
      - name: type
        type: string
        example: new | seed | watch | ledger_nano_x
        description: Method chosen. The event schema also allows 'backup', but no call sends it. Restore-from-cloud sends 'seed'.
      - name: walletAddressHash
        type: string
        example: UNCONFIRMED
        required: false
        description: Hash of the active wallet address, added by analytics.track. Missing before a wallet exists.
      - name: walletType
        type: string
        example: owned | hardware | watched
        required: false
        description: Type of the active wallet, added by analytics.track. Missing before a wallet exists.
    changelog:
      - date: 2026-10-31
        ref: install-audit
        change: Drafted from code; nothing arriving
  - name: analytics_tracking.disabled
    section: Settings
    description: The person switches the Analytics toggle off in Settings > Privacy. Fires on the toggle, just before
      analytics.disable() is called, so it is the last event sent before tracking stops. It sets the doNotTrack device
      flag in the same reducer.
    question: How many people opt out of analytics, and which kinds of wallets do they hold?
    track_via: client
    properties:
      - name: walletAddressHash
        type: string
        example: UNCONFIRMED
        required: false
        description: Hash of the active wallet address, added by analytics.track.
      - name: walletType
        type: string
        example: owned | hardware | watched
        required: false
        description: Type of the active wallet, added by analytics.track.
    changelog:
      - date: 2026-10-31
        ref: install-audit
        change: Drafted from code; nothing arriving
  - name: analytics_tracking.enabled
    section: Settings
    description: The person switches the Analytics toggle back on in Settings > Privacy. Fires on the toggle, just after
      analytics.enable() and after doNotTrack is cleared. It does not fire when analytics is on by default.
    question: How many people who opted out turn analytics back on?
    track_via: client
    properties:
      - name: walletAddressHash
        type: string
        example: UNCONFIRMED
        required: false
        description: Hash of the active wallet address, added by analytics.track.
      - name: walletType
        type: string
        example: owned | hardware | watched
        required: false
        description: Type of the active wallet, added by analytics.track.
    changelog:
      - date: 2026-10-31
