  - name: Received wc connection
    section: WalletConnect
    description: A WalletConnect approval sheet is shown for a dapp, once interactions settle after mount. It records that a
      request arrived and how long it waited, not whether the person approved it. Approval or rejection goes through
      handleSuccess and is not tracked here. The effect re-runs, and re-fires, if dappName, dappUrl or receivedTimestamp
      change while the sheet is open. The sheet also fires shownWalletconnectSessionRequest on mount.
    question: How many dapp connection requests do people receive, and how long do they wait before the sheet shows?
    track_via: client
    properties:
      - name: dappName
        type: string
        example: UNCONFIRMED
        required: false
        description: Name the dapp gives itself in the WalletConnect request.
      - name: dappUrl
        type: string
        example: UNCONFIRMED
        required: false
        description: URL the dapp gives in the WalletConnect request.
      - name: waitingTime
        type: numeric
        example: 1.8 | Error calculating waiting time.
        required: false
        description: Seconds between the request being received and the sheet showing. It becomes the string 'Error calculating
          waiting time.' when the timestamp is invalid, so the type is mixed.
      - name: walletAddressHash
        type: string
        example: UNCONFIRMED
        required: false
        description: Hash of the active wallet address, added by analytics.track.
      - name: walletType
        type: string
        example: owned | hardware | watched
        required: false
        description: Type of the active wallet, added by analytics.track.
    changelog:
      - date: 2026-10-31
        ref: install-audit
        change: Drafted from code; nothing arriving
