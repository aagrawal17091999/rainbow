  - name: watch_wallet
    section: Wallet import
    description: "Fires on the client when a person adds a read-only (watched) wallet through the import flow, i.e.
      `handlePressImportButton` is called with `type === 'watch'`. It fires once the typed or passed-in input has resolved
      to an address: an ENS name via the provider, an Unstoppable domain, a valid 0x address (after the reverse-ENS
      lookup), or a value that `deriveAccountFromWalletInput` accepts. It fires before `startImportProfile` opens the
      profile sheet or imports, so it records the intent to watch, not a completed import. It does not fire for `type ===
      'import'`, for an ENS or Unstoppable name that fails to resolve, for a malformed address, or when the ENS lookup
      throws. Nothing in this event reports whether the wallet was added afterwards."
    question: How many watch-only wallets do people try to add, and how do they enter them (ENS name, Unstoppable domain,
      raw address)?
    track_via: client
    properties:
      - name: address
        type: string
        example: 0x… 42-character hex address (the resolved address for ENS and Unstoppable input, the raw input otherwise)
        description: Wallet address being watched. Sent in plain text on every call path.
      - name: addressOrEnsName
        type: string
        example: vitalik.eth | 0x… hex address | name.crypto
        description: The ENS or Unstoppable name typed when the input was a name. For raw addresses it is the reverse-ENS
          record, which can be empty or null when none exists, or the address itself if the lookup failed.
      - name: ens
        type: string
        example: UNCONFIRMED
        required: false
      - name: input
        type: string
        example: UNCONFIRMED
        required: false
      - name: type
        type: string
        example: UNCONFIRMED
        required: false
      - name: walletAddressHash
        type: string
        example: UNCONFIRMED
        required: false
        description: Hash of the active wallet's address. The analytics client adds it from the stored wallet context, not the
          call site. It is the active wallet, not the one being watched, and is undefined if the context isn't set.
      - name: walletType
        type: string
        example: owned | hardware | watched
        required: false
        description: Type of the active wallet, added by the analytics client from the wallet context. It can be undefined, for
          example right after the first wallet is created.
    changelog:
      - date: 2026-10-31
        ref: install-audit
        change: Drafted from code; nothing arriving
