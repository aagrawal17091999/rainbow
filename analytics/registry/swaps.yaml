    section: Swaps
    description: A quote request (getQuote or getCrosschainQuote) came back while the Swap screen is still mounted, in
      useSwapInputsController. Fires for every response, including error quotes and null, before the response is checked,
      so it is not a success signal. Quotes are re-fetched on an interval, so one swap attempt can produce many of these.
    question: How many quotes are requested per swap attempt, and what share come back as errors?
