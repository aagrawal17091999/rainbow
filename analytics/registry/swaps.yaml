  - name: swaps.submitted
    section: Swaps
    description: "The swap was handed off by the rap without an error and the sheet dismissal has been scheduled; fires from
      trackSwapEvent at the end of the try block in getNonceAndPerformSwap (swap-provider.tsx). Means submitted to the
      network/relayer, not confirmed on-chain (that is swaps.succeeded). Note: the error branch only alerts and returns in
      some cases ('handled' falls through), so a 'handled' error can also reach this call after swaps.failed; confirm with
      the team."
    question: How many swaps do users submit, for which pairs and chains, and with what share going through degen mode,
      bridges or hardware wallets?
    track_via: client
    properties:
      - name: asset
        type: object
        example: UNCONFIRMED
        required: false
        description: Not sent by this event's call (draft cross-contamination from swaps.selected_asset).
      - name: degenMode
        type: boolean
        example: true | false
        description: Whether degen mode was on in the swaps store.
      - name: errorMessage
        type: string
        example: "null"
        description: Always sent, always null on this event (errorMessage ?? null).
      - name: inputAssetAddress
        type: string
        example: UNCONFIRMED
        description: Token contract address of the sold asset; '' if missing.
      - name: inputAssetAmount
        type: numeric
        example: UNCONFIRMED
        description: "Number(quote.sellAmount): raw sell amount in the token's smallest unit."
      - name: inputAssetChainId
        type: numeric
        example: 1 | 8453 | UNCONFIRMED
        description: Chain id of the sold asset; defaults to mainnet.
      - name: inputAssetName
        type: string
        example: UNCONFIRMED
        description: Name of the sold token; '' if missing.
      - name: inputAssetSymbol
