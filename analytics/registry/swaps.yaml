events:
  - name: insufficient_native_asset_for_action
    section: Swaps
    description: "The user's balance of the chain's native (gas) asset is too low to pay the gas for the action on screen.
      Fires from two places: (1) useTrackInsufficientGas in useGas.ts, in an effect, once per chain when gas is valid
      (isValidGas) and not sufficient (!isSufficientGas); it is re-armed only when chainId changes, so a chain that goes
      sufficient and then insufficient again does not fire a second time; (2) reportInsufficientFunds in the Swap screen's
      SyncSwapStateAndSharedValues, which sends type 'Swap'. Not a failed transaction: nothing was submitted, the user is
      only warned."
    question: On which chains and screens do users run out of native gas asset before they can act?
    track_via: client
    properties:
      - name: nativeAssetSymbol
        type: string
        example: ETH | UNCONFIRMED
        required: false
        description: Symbol of the chain's native asset; undefined if the native asset isn't found for the chain (useGas.ts:94).
      - name: type
        type: string
        example: Swap | UNCONFIRMED
        description: Navigation route name the user is on (useRoute().name in useGas.ts), or the literal Routes.SWAP ('Swap')
          from the swap screen.
      - name: walletAddressHash
        type: string
        example: UNCONFIRMED
        required: false
        description: Hash of the active wallet address, added by the analytics wrapper to every event; undefined until the
          wallet context is set.
      - name: walletType
        type: string
        example: owned | hardware | watched
        required: false
        description: Added by the analytics wrapper to every event; undefined right after wallet creation.
    changelog:
      - date: 2026-10-31
        ref: install-audit
        change: Drafted from code; nothing arriving
  - name: swaps.changed_chain_id
    section: Swaps
    description: The user picks a chain in the network selector of the swap token list (handleSelectChain in
      ChainSelection.tsx). Fires right after the selection is applied, once per pick, for both the input list filter and
      the output chain. type says which side. Choosing 'all networks' on the input side sends chainId undefined. Fires
      whether or not the chain actually differs from the current one.
    question: Which chains do users filter or swap to, and how often do they switch chains while building a swap?
    track_via: client
    properties:
      - name: chainId
        type: numeric
        example: 1 | 8453 | UNCONFIRMED
        description: Selected chain id (ChainId enum); key is always sent but the value is undefined for 'all networks' on the
          input side.
      - name: inputAsset
        type: object
        example: UNCONFIRMED
        description: The whole input asset object from the swaps store at that moment (null if none). Large object; not a flat value.
      - name: type
        type: string
        example: input | output
        description: Which side's chain was changed.
      - name: walletAddressHash
        type: string
        example: UNCONFIRMED
        required: false
        description: Added by the analytics wrapper to every event.
      - name: walletType
        type: string
        example: owned | hardware | watched
        required: false
        description: Added by the analytics wrapper to every event.
    changelog:
      - date: 2026-10-31
        ref: install-audit
        change: Drafted from code; nothing arriving
  - name: swaps.failed
    section: Swaps
    description: The swap execution step returned an error (errorMessage set) after the user confirmed the swap; fires from
      trackSwapEvent in swap-provider.tsx getNonceAndPerformSwap right after the rap returns, before the error alert.
      errorMessage can be the sentinel 'handled' (error already shown elsewhere). It does not fire for quote failures (see
      swaps.quote_failed) or for exceptions thrown in the surrounding try/catch (those are only logged). It is the failure
      counterpart of swaps.submitted, which fires on the success path.
    question: How many swaps fail at execution, on which chains and assets, and with what error?
    track_via: client
    properties:
      - name: asset
        type: object
        example: UNCONFIRMED
        required: false
        description: Not sent by this event's call; belongs to swaps.selected_asset (draft cross-contamination).
      - name: degenMode
        type: boolean
        example: true | false
        description: Whether degen mode was on in the swaps store.
      - name: errorMessage
        type: string
        example: handled | UNCONFIRMED
        description: "Error text returned by the swap execution; always a string on this event. Free text from the error: check
          it can't contain user data."
      - name: inputAssetAddress
        type: string
        example: UNCONFIRMED
        description: Token contract address of the sold asset; '' if no input asset in the store.
      - name: inputAssetAmount
        type: numeric
        example: UNCONFIRMED
        description: "Number(quote.sellAmount): the raw sell amount in the token's smallest unit, converted to a JS number."
      - name: inputAssetChainId
        type: numeric
        example: 1 | 8453 | UNCONFIRMED
        description: Chain id of the sold asset; defaults to mainnet (1) when missing.
      - name: inputAssetName
        type: string
        example: UNCONFIRMED
        description: Name of the sold token; '' if missing.
      - name: inputAssetSymbol
        type: string
        example: ETH | USDC | UNCONFIRMED
        description: Symbol of the sold token; '' if missing.
      - name: inputAssetType
        type: string
        example: UNCONFIRMED
        description: Token type field from the asset; '' if missing.
      - name: isBridge
        type: boolean
        example: true | false
        description: True when the output asset is the same token on another chain as the input asset.
      - name: isHardwareWallet
        type: boolean
        example: true | false
        description: True when the signer is a Ledger.
      - name: isSwappingToPopularAsset
        type: boolean
        example: true | false
        description: True when the output asset came from the 'popular' section of the token list.
      - name: mainnetAddress
        type: string
        example: UNCONFIRMED
        description: "Mainnet address of the token: the bought asset's address if it is on mainnet, otherwise the sold asset's
          mainnetAddress."
      - name: otherAsset
        type: object
        example: UNCONFIRMED
        required: false
        description: Not sent by this event's call; belongs to swaps.selected_asset (draft cross-contamination).
      - name: outputAssetAddress
        type: string
        example: UNCONFIRMED
        description: Token contract address of the bought asset; '' if missing.
      - name: outputAssetAmount
        type: numeric
        example: UNCONFIRMED
        description: "Number(quote.buyAmount): raw buy amount in the token's smallest unit."
      - name: outputAssetChainId
        type: numeric
        example: 1 | 8453 | UNCONFIRMED
        description: Chain id of the bought asset; defaults to mainnet (1).
      - name: outputAssetName
        type: string
        example: UNCONFIRMED
        description: Name of the bought token; '' if missing.
      - name: outputAssetSymbol
        type: string
        example: UNCONFIRMED
        description: Symbol of the bought token; '' if missing.
      - name: outputAssetType
        type: string
        example: UNCONFIRMED
        description: Token type field of the bought asset; '' if missing.
      - name: parameters
        type: object
        example: UNCONFIRMED
        required: false
        description: "Not sent: trackSwapEvent receives it only to read quote and asset fields (draft artifact)."
      - name: tradeAmountUSD
        type: numeric
        example: UNCONFIRMED
        description: "quote.tradeAmountUSD: USD value of the trade."
      - name: type
        type: string
        example: swap | crosschainSwap
        description: Same-chain swap or cross-chain swap.
      - name: walletAddressHash
        type: string
        example: UNCONFIRMED
        required: false
        description: Added by the analytics wrapper to every event.
      - name: walletType
        type: string
        example: owned | hardware | watched
        required: false
        description: Added by the analytics wrapper to every event.
    changelog:
      - date: 2026-10-31
        ref: install-audit
        change: Drafted from code; nothing arriving
