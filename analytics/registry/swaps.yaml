  - name: swaps.quote_failed
    section: Swaps
    description: The quote fetch returned a QuoteError (e.g. insufficient funds, out of gas, no routes found, no quotes
      found) and an input asset, output asset and non-zero input amount are set (analyticsTrackQuoteFailed, called from
      useSwapInputsController when the quote is set). Skipped when the same error_code, amounts and asset addresses as the
      previous failure repeat, so quote polling does not re-fire it. Fires on the JS thread via runOnJS from a worklet.
    question: Why do users fail to get a quote (no route, insufficient funds, out of gas), and for which pairs?
    track_via: client
    properties:
      - name: walletAddressHash
        type: string
        example: UNCONFIRMED
        required: false
        description: Added by the analytics wrapper to every event.
      - name: walletType
        type: string
