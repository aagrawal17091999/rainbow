  - name: token_list
    section: Swaps
    description: "A snapshot of how complete a token list is when it is displayed, with the counts of tokens missing an icon
      or price. Four senders: (1) swap search (useSearchCurrencyLists, screen 'swap'): when the search query has more than
      2 characters, token search status is 'success' and at most once per 5 s; (2) Discover search (DiscoverSearch, screen
      'discover'): 3 s after the list is not loading, if the list is non-empty; (3) Send sheet (screen 'send'): when the
      user's assets finish loading; (4) wallet home (useWalletSectionsData, screen 'wallet'): when user assets finish
      loading. Effects re-run when the list data changes, so one visit can fire several times. Not a user action."
    question: How much of what users see in token lists lacks an icon or price, per screen?
    track_via: client
    properties:
      - name: no_icon
        type: numeric
        example: 0 | 3
        description: Count of tokens in the list with no icon_url.
      - name: no_price
        type: numeric
        example: 0 | 5
        required: false
        description: Count of tokens with no price; sent only on discover, send and wallet (not swap). Discover counts assets
          whose price is a number (inverted condition), so it measures the opposite.
      - name: query
        type: string
        example: UNCONFIRMED
        required: false
        description: Raw search text; sent only from swap and discover.
      - name: screen
        type: string
        example: swap | discover | send | wallet
        description: Which list was shown.
      - name: total_tokens
        type: numeric
        example: 0 | 42
        description: Number of tokens in the list (headers excluded on swap).
      - name: walletAddressHash
        type: string
        example: UNCONFIRMED
        required: false
        description: Added by the analytics wrapper to every event.
      - name: walletType
        type: string
        example: owned | hardware | watched
        required: false
        description: Added by the analytics wrapper to every event.
